[tool.poetry]
authors = ["Bas Brussee"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3",
]
description = "Adaptive Cover"
documentation = "https://github.com/basbruss/adaptive-cover"
homepage = "https://github.com/basbruss/adaptive-cover"
license = "Passive Aggressive License"
maintainers = ["Bas Brussee"]
name = "adaptive_cover"
packages = []
readme = "README.md"
repository = "https://github.com/basbruss/adaptive-cover"
version = "0.0.0"

[tool.poetry.dependencies]
homeassistant = ">=2026.5.0"
python = "^3.13"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.0"
pre-commit-hooks = "^5.0"
pylint = "^3.3"
pytest = "^9.0"
pytest-homeassistant-custom-component = "^0.13"
ruff = "^0.16"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/basbruss/adaptive-cover/issues"
Changelog = "https://github.com/basbruss/adaptive-cover/releases"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]

[tool.pytest.ini_options]
# pytest-homeassistant-custom-component ships an autouse *async* fixture
# (enable_event_loop_debug). Under pytest-asyncio's default strict mode a sync
# test requesting it is a collection error, so the whole suite fails to run.
asyncio_mode = "auto"
testpaths = ["tests"]

# Ruff is configured in .ruff.toml, which takes precedence over any
# [tool.ruff] table here — keeping a second copy in this file only creates
# two sources of truth that silently disagree.

[tool.pylint."MESSAGES CONTROL"]
# Reasons disabled:
# format - handled by ruff
# duplicate-code - unavoidable
# used-before-assignment - false positives with TYPE_CHECKING structures
disable = [
  "format",
  "duplicate-code",
  "used-before-assignment",
]
